name: Bug report
description: Report a reproducible defect in dart_modem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code, modem configuration, and PCM conditions needed to reproduce it.
      render: dart
    validations:
      required: true
  - type: input
    id: dart-version
    attributes:
      label: Dart version
      placeholder: "Dart 3.x"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Dart VM
        - Flutter
        - Server-side Dart
        - Web / WASM
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true

